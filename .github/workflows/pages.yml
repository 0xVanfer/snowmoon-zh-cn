name: Deploy reader site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 组装阅读站点
        run: |
          python3 pipeline/build_markdown.py
          python3 pipeline/build_site.py
      - name: 校验（任一项失败即中止发布）
        run: |
          # 仓库里不得出现端点 / 凭据 / provider 命名的痕迹。
          # 规则 3 的基础层是入库的内置形状规则，任何 clone 都真跑（不是只在作者机器上）。
          python3 pipeline/check_privacy.py
          # 译文结构 / 插图等价性 / 抽取还原 —— 不需要上游原文的项先跑
          python3 pipeline/validate_translation.py
          python3 pipeline/validate_svg.py
          python3 pipeline/verify_extract.py   # 上游原文不入库，缺失时自动跳过
          # 术语表是唯一事实源：与译文冲突或有未合并的新术语都必须让发布停下
          python3 pipeline/merge_terms.py --check
          # 术语表加载期自检。别名前缀冲突的检查只挂在 load_aliases() 上，
          # 而 normalize_zh 是改写工具不是闸门，CI 不会调它——不给这个入口，
          # 一条会静默吃掉前缀的 alias 可以长期潜伏到有人手动跑 normalize_zh 才炸。
          python3 pipeline/normalize_zh.py --self-check
          # 成品体检
          python3 pipeline/qa_book.py
          python3 pipeline/qa_site.py
          # 术语卡片：三向对账（terms.json ↔ 43 篇科普 ↔ 构建产物）。
          # 必须排在 qa_site 之后——它校验的是最终产物里有没有真的标出术语、
          # 卡片里的章号链接能不能落到真实段落，只查数据文件自洽是不够的。
          python3 pipeline/validate_terms.py
      # 交互探针：唯一能抓住「作用域错误」这类缺陷的闸门。
      # 翻页模式曾经因为 reader.js 里两行跨作用域引用而 100% 不可用，
      # 六道静态闸门全部放行 —— node --check 也查不出（那是作用域问题，不是语法问题）。
      # 本轮又靠它抓到深链入口的同一个毛病（applyDeepLink 定义在一个 IIFE、
      # 调用点在另一个，运行时报 ReferenceError，而静态守卫只 grep 了函数名）。
      # 浏览器由 pipeline/chrome_runtime.py 挑：它逐个候选**真跑一次** --dump-dom 才认，
      # 不会挑中一个存在却起不来的二进制（那会让整套探针 0/N 全红，看起来像全站坏了）。
      # 本机 34/34 通过（macOS + Playwright headless_shell + --single-process，
      # 见 docs/lessons.md 第 10 节与「本轮（全局审计）新增的坑」）。
      # 仍不阻断发布：无头环境偶发虚拟时间抖动，探针自带一次重跑兜底，
      # 但重跑也失败时无法区分是回归还是环境；CI 上没有 Chrome 时会在导入期
      # SystemExit 并逐条说明原因，同样由 continue-on-error 放行。
      - name: 交互探针（需要 Chrome）
        if: ${{ always() }}
        continue-on-error: true
        run: python3 pipeline/probe_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: book/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
